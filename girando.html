<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Aula Prática 1 - Criando com WebGL</title>

    <!-- 
      1. SHADERS BÁSICOS
      Estrutura mínima para a GPU compilar sem erro.
    -->
    <script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec4 vPosition;
    attribute vec4 vColor;
    uniform mat4 uProjection;

    varying vec4 fColor;

    void main() {
        gl_Position = uProjection * vPosition;
        //gl_Position = vPosition;
        fColor=vColor;
    }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
    precision mediump float;
    varying vec4 fColor;

    void main() {
        // PASSO A PASSO DA AULA: Alterar a cor aqui mais tarde
        //gl_FragColor = vec4(1.0, 0.0,1.0, 1.0); 
        gl_FragColor = fColor; 
    }
    </script>


    <!-- Bibliotecas Auxiliares -->
    <script type="text/javascript" src="Common/MV.js"></script>
    <script type="text/javascript" src="Common/webgl-utils.js"></script>
    <script type="text/javascript" src="Common/initShaders.js"></script>

    <!-- Script principal -->
    <script type="text/javascript" src="girando.js"></script>
    
</head>

<body>

        Seu navegador não suporta HTML5 Canvas.
    </canvas>
</body>
</html>
